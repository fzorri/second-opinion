providers:
  anthropic:
    api_key_env: ANTHROPIC_API_KEY
    class: Anthropic_LLM
    module: llm_classes.llm_anthropic_base
    models:
      - model_name: "Claude V4.6 - Sonnet - 3M/3.75M"
        model_id: "claude-sonnet-4-6"
        model_folder: "models/anthropic-sonnet-46"
        enabled: true
        media:
          image: true
      - model_name: "Claude Haiku 4.5 - 3M/3.75M"
        model_id: "claude-haiku-4-5"
        model_folder: "models/anthropic-haiku-45"
        enabled: true
        media:
          image: true
  deepseek:
    api_key_env: DEEPSEEK_API_KEY
    class: DeepSeek_LLM
    module: llm_classes.llm_deepseek_base
    models:
      - model_name: "DeepSeek (chat)"
        model_id: "deepseek-chat"
        model_folder: "models/deepsek-chat"
        max_tokens: 131072
        enabled: true
        media:
          image: true
      - model_name: "DeepSeek (reasoner)"
        model_id: "deepseek-reasoner"
        model_folder: "models/deepseek-reasoner"
        max_tokens: 131072
        enabled: true
        media:
          image: true
  fireworks:
    api_key_env: FIREWORKS_API_KEY
    class: Fireworks_LLM
    module: llm_classes.llm_fireworks_base
    models:
      - model_name: "Qwen 3.6 + fireworks.ai - 20260420"
        model_id: "accounts/fireworks/models/qwen3p6-plus"
        model_folder: "models/fireworks-qwen36_-plus"
        enabled: true
        media:
          image: true
      - model_name: "Qwen 3 Coder 480b-a35 - fireworks.ai - 20260420"
        model_id: "accounts/fireworks/models/qwen3-coder-480b-a35b-instruct"
        model_folder: "models/fireworks-qwen3-coder-480b"
        enabled: true
        media:
          image: false
      - model_name: "Kimi K2.5 Thinking - fireworks.ai - 20260420"
        model_id: "accounts/fireworks/models/kimi-k2p5"
        model_folder: "models/kimik25-thinking"
        enabled: true
        media:
          image: true
  google:
    api_key_env: GOOGLE_API_KEY
    class: Google_LLM
    module: llm_classes.llm_google_base
    models:
      - model_name: "Gemini Pro 3.0 Preview"
        model_id: "models/gemini-3-pro-preview"
        model_folder: "models/gemini-pro-3-preview"
        max_tokens: 256000
        enabled: true
        web_search: true
        media:
          image: true
      - model_name: "Gemini Pro 2.5"
        model_id: "models/gemini-2.5-pro"
        model_folder: "models/gemini-pro-2_5"
        max_tokens: 256000
        enabled: true
        web_search: true
        media:
          image: true
      - model_name: "Gemini Flash 2.5"
        model_id: "models/gemini-2.5-flash"
        model_folder: "models/gemini-flash-2_5"
        max_tokens: 1048576
        enabled: true
        web_search: true
        media:
          image: true
  openai:
    api_key_env: OPENAI_API_KEY
    class: OpenAI_LLM
    module: llm_classes.llm_openai_chatgpt_base
    models:
      - model_name: "ChatGPT 5.4 mini (OpenAI) 0.75M / 4.50M"
        model_id: "gpt-5.4-mini"
        model_folder: "models/openai-mini-54"
        max_tokens: 128000
        enabled: true
        web_search: true
        media:
          image: true
      - model_name: "GPT 5.3 Codex 1.75M/14M"
        model_id: "gpt-5.3-codex"
        model_folder: "models/gpt-53-codex"
        enabled: true
        max_tokens: 128000
        web_search: true
        media:
          image: true
      - model_name: "GPT 5.1 Codex mini 0.25M/2M"
        model_id: "gpt-5.1-codex-mini"
        model_folder: "models/openai-gpt-51-mini"
        max_tokens: 128000
        enabled: true
        web_search: true
        media:
          image: true
  xai:
    api_key_env: XAI_API_KEY
    class: XAI_LLM
    module: llm_classes.llm_xai_base
    models:
      - model_name: "Grok 4.1 Fast non-reasoning (Xai)"
        model_id: "grok-4-1-fast-non-reasoning"
        model_folder: "models/grok-4-fnr"
        max_tokens: 1000000
        enabled: true
        web_search: true
        media:
          image: true
      - model_name: "Grok 4.1 Fast Reasoning (Xai)"
        model_id: "grok-4-1-fast-reasoning"
        model_folder: "models/grok-4-fr"
        max_tokens: 1000000
        enabled: true
        web_search: true
        media:
          image: true
  nvidia:
    api_key_env: NVIDIA_API_KEY
    class: Nvidia_LLM
    module: llm_classes.llm_nvidia_base
    models:
      - model_name: "DeepSeek V4 Flash (Nvidia)"
        model_id: "deepseek-ai/deepseek-v4-flash"
        model_folder: "models/nvidia-deepseek-v4-flash"
        show_reasoning: true
        enable_thinking: true
        reasoning_effort: "high"
        thinking_param: "thinking"
        enabled: true
        media:
          image: false
      - model_name: "GLM 5.2 (Nvidia)"
        model_id: "z-ai/glm-5.2"
        model_folder: "models/nvidia-glm-5-2"
        show_reasoning: false
        enable_thinking: false
        max_toxens: 512000
        enabled: true
        media:
          image: false
      - model_name: "Nemotron 3 Ultra 550b (Nvidia)"
        model_id: "nvidia/nemotron-3-ultra-550b-a55b"
        model_folder: "models/nvidia-nemotron-3-ultra-550b"
        show_reasoning: false
        enable_thinking: true
        thinking_param: "enable_thinking"
        max_toxens: 512000
        enabled: true
        media:
          image: false
      - model_name: "Minimax M3 (Nvidia)"
        model_id: "minimaxai/minimax-m3"
        model_folder: "models/minimax-m3"
        show_reasoning: false
        enable_thinking: false
        thinking_param: "enable_thinking"
        max_toxens: 512000
        enabled: true
        media:
          image: false

        