        max_tokens: 128000
        enabled: true
  xai:
    api_key_env: XAI_API_KEY
    class: XAI_LLM
    module: llm_classes.llm_xai_base
    models:
      - model_name: "Grok 4.1 Fast non-reasoning (Xai)"
        model_id: "grok-4-1-fast-non-reasoning"
        model_folder: "models/grok-4-fnr"
        max_tokens: 1000000
        enabled: true
      - model_name: "Grok 4.1 Fast Reasoning (Xai)"
        model_id: "grok-4-1-fast-reasoning"
        model_folder: "models/grok-4-fr"
        max_tokens: 1000000
        enabled: true
      - model_name: "Grok 4 (Xai)"
        model_id: "grok-4-0709"
        model_folder: "models/grok-4"
        max_tokens: 250000
        enabled: true
      - model_name: "Grok 4 Fast - 20250923"
        model_id: "grok-code-fast-1"
        model_folder: "models/grok-code-fast-1"
        max_tokens": 2097152
        enabled: true
